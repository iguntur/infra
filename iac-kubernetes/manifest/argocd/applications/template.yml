apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: <your-app-name>
  namespace: argocd
spec:
  project: <project-name>
  destination:
    server: https://kubernetes.default.svc
    namespace: <app-namespace>
  source:
    path: ...
    repoURL: git@github.com:starmediateknik/k8s-manifest.git
    targetRevision: HEAD
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
