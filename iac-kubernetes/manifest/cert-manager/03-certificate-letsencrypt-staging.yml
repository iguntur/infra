apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: letsencrypt-staging-local-gunturpoetra-com
  # TODO: replace with your namespace (eg: app-staging)
  # namespace: traefik-system
spec:
  secretName: local-gunturpoetra-com-staging-tls
  issuerRef:
    name: letsencrypt-issuer-staging
    kind: ClusterIssuer
  commonName: "*.local.gunturpoetra.com"
  dnsNames:
    - "local.gunturpoetra.com"
    - "*.local.gunturpoetra.com"
    - "*.staging.local.gunturpoetra.com"
