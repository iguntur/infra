apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: letsencrypt-production-local-gunturpoetra-com
spec:
  secretName: local-gunturpoetra-com-production-tls
  issuerRef:
    name: letsencrypt-issuer-production
    kind: ClusterIssuer
  commonName: "*.local.gunturpoetra.com"
  dnsNames:
    - "local.gunturpoetra.com"
    - "*.local.gunturpoetra.com"
    - "*.staging.local.gunturpoetra.com"
